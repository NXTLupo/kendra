name: Kendra CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check kendra tests scripts simulator/webots/controllers
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q kendra scripts simulator/webots/controllers
      - name: Manifest structure
        run: python scripts/verify_files.py --allow-missing

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard
        working-directory: dashboard
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Test dashboard
        working-directory: dashboard
        run: npm test
      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint
