project:
  mode: simulation

paths:
  runtime_dir: ./runtime/pc
  brain_db: ./data/kendra-brain.db
  identity_db: ./data/kendra-identities.db

body:
  driver: simulation
  capabilities:
    body_name: kendra-digital-twin
    leg_dof: 18
    camera_dof: 2
    has_head_gimbal: true
    has_imu: true
    has_cliff_sensors: true
    cliff_sensor_count: 4
    has_servo_feedback: true
    supports_height_control: true
    supports_overload_telemetry: true
    has_ultrasonic: true
    has_battery_voltage: true

reflex:
  sensors:
    provider: simulation

vision:
  camera_provider: opencv
  camera_index: 0
  semantic_provider: moondream_onnx
  semantic_vlm_url: http://127.0.0.1:17801/v1

voice:
  # Desktop: no physical motion to emergency-stop, and the per-phrase stop
  # monitor was opening a fresh CoreAudio input stream for every sentence —
  # the main source of 'Error opening RawInputStream' wake-loop crashes.
  # The robot profile keeps this on.
  barge_in_monitor: false
  capture:
    # auto: probe every input and pick the one carrying a live signal.
    #
    # This was pinned to "AG06" -- Jonathan's guitar interface, which is only
    # switched on when he is playing. Every other time it is absent, so she
    # logged a device error on each start and fell through to probing. Pinning
    # a device that is usually off is worse than not pinning one: it makes a
    # normal start look like a fault. Pin a name here only for a microphone
    # that is always connected.
    device: auto
  wake:
    provider: vosk_keyword
    phrase: kendra
  stop_wake:
    provider: vosk_keyword
    phrase: stop kendra

brain:
  embedding:
    provider: hashing

agent:
  allow_autonomy: false

autonomy:
  enabled: false
