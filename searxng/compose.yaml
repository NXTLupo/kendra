services:
  searxng:
    image: "${SEARXNG_IMAGE:?Set SEARXNG_IMAGE to searxng/searxng@sha256:<verified-digest>}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./data:/var/cache/searxng
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8888/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set a random local SearXNG secret}"
      SEARXNG_SETTINGS_PATH: "/etc/searxng/settings.yml"
